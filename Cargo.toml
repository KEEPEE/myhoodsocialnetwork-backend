# Workspace pre backend MyHoodSocialNetwork (P2P sieť pre malé komunity).
# D-02: jedno jadro (crates/core, sans-IO) + binárka uzla (crates/node).
[workspace]
resolver = "2"
members = ["crates/core", "crates/node"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
